<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>엽녜 1차 달글</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #faf8f7; color: #2d2926; font-family: system-ui, -apple-system, "Malgun Gothic", sans-serif; }
    main { width: min(88vw, 34rem); text-align: center; }
    h1 { font-size: 1.3rem; font-weight: 650; line-height: 1.6; }
    p { color: #706a65; margin: 1.2rem 0 2rem; }
    nav { display: grid; gap: .8rem; }
    a { display: block; padding: 1rem; border-radius: .75rem; background: #fff; color: inherit; text-decoration: none; box-shadow: 0 2px 12px #00000010; }
    a:hover { background: #f0e9e4; }
  </style>
</head>
<body>
  <main>
    <h1>🎻 아무리 봐도 둘이 사귀는 게 아니면<br>내가 곤란한 엽녜 🎸</h1>
    <p>열람할 환경을 선택해 주세요.</p>
    <nav>
      <a href="pc.html">PC 버전</a>
      <a href="mobile.html">모바일 버전</a>
    </nav>
  </main>
</body>
</html>
